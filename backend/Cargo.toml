[package]
name = "portfolio-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "portfolio_backend"
path = "src/lib.rs"

[[bin]]
name = "portfolio-backend"
path = "src/main.rs"

[[bin]]
name = "bloggen"
path = "src/bin/bloggen.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.11"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }

[dev-dependencies]
ts-rs = { version = "10", features = ["serde-compat"] }
