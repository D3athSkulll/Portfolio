<!doctype html>
<html lang="en" data-theme="retro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shivam Deolankar — systems programmer. C and Rust, OS internals, embedded, backend. Portfolio, projects and blog."
    />
    <meta name="theme-color" content="#0c0a12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <title>SHIVAM DEOLANKAR</title>
    <script>
      // Set theme before paint to avoid a flash.
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = q || localStorage.getItem("theme");
        if (t === "docs") t = "vim"; // migrate old value
        if (t !== "retro" && t !== "vim")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "vim" : "retro";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
