<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <rect width="1200" height="460" fill="#0b0e14"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <!-- top row: backbone pipeline -->
  <g font-size="13" fill="#cfe4ff">
    <!-- boxes -->
    <g id="boxes">
      <rect x="20"  y="40" width="140" height="70" rx="6" fill="#141a24" stroke="#3a4656"/>
      <rect x="200" y="40" width="140" height="70" rx="6" fill="#141a24" stroke="#3a4656"/>
      <rect x="380" y="40" width="140" height="70" rx="6" fill="#141a24" stroke="#3a4656"/>
      <rect x="560" y="40" width="150" height="70" rx="6" fill="#1c2a1f" stroke="#39ff9e"/>
      <rect x="750" y="20" width="220" height="130" rx="6" fill="#141a24" stroke="#3a4656"/>
      <rect x="1010" y="40" width="140" height="70" rx="6" fill="#141a24" stroke="#3a4656"/>
    </g>
    <text x="90"  y="70"  text-anchor="middle">Lookback</text>
    <text x="90"  y="86"  text-anchor="middle" font-size="11" fill="#8aa0b8">L×N series</text>
    <text x="270" y="70"  text-anchor="middle">Linear</text>
    <text x="270" y="86"  text-anchor="middle" font-size="11" fill="#8aa0b8">→ d_model</text>
    <text x="450" y="70"  text-anchor="middle">SWT</text>
    <text x="450" y="86"  text-anchor="middle" font-size="11" fill="#8aa0b8">S bands</text>
    <text x="635" y="66"  text-anchor="middle" fill="#39ff9e" font-weight="700">BandAttention</text>
    <text x="635" y="84"  text-anchor="middle" font-size="11" fill="#8aa0b8">per-band weight α</text>
    <text x="635" y="100" text-anchor="middle" font-size="11" fill="#8aa0b8">(added module)</text>
    <text x="860" y="45"  text-anchor="middle" font-weight="700">Geometric Attention</text>
    <text x="860" y="70"  text-anchor="middle" font-size="12" fill="#a7c8ff">scalar branch  QKᵀ→softmax→V</text>
    <text x="860" y="90"  text-anchor="middle" font-size="12" fill="#ffb648">bivector branch  Q∧K→ζ(·)→V</text>
    <text x="860" y="115" text-anchor="middle" font-size="11" fill="#8aa0b8">fused elementwise</text>
    <text x="1080" y="70" text-anchor="middle">ISWT</text>
    <text x="1080" y="86" text-anchor="middle" font-size="11" fill="#8aa0b8">reconstruct</text>

    <!-- arrows top row -->
    <line x1="160" y1="75" x2="198" y2="75" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="75" x2="378" y2="75" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="75" x2="558" y2="75" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="710" y1="75" x2="748" y2="75" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="970" y1="75" x2="1008" y2="75" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- second row: FFN + loss -->
  <g font-size="13" fill="#cfe4ff">
    <rect x="750" y="220" width="220" height="60" rx="6" fill="#141a24" stroke="#3a4656"/>
    <rect x="1010" y="220" width="140" height="60" rx="6" fill="#141a24" stroke="#3a4656"/>
    <text x="860" y="248" text-anchor="middle">FFN + LayerNorm</text>
    <text x="1080" y="248" text-anchor="middle">MSE Loss</text>

    <line x1="1080" y1="110" x2="1080" y2="218" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1095" y="175" font-size="11" fill="#8aa0b8">down to FFN</text>
    <line x1="1010" y1="250" x2="970" y2="250" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- backprop path -->
  <path d="M 1080 282 C 1080 380, 90 380, 90 112" fill="none" stroke="#ff6b6b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="560" y="400" text-anchor="middle" font-size="12" fill="#ff9b9b">backward propagation, end to end</text>

  <text x="20" y="330" font-size="12" fill="#6a819a">
    Fig. 1 — SimpleTM with BandAttention. The dashed green box is the only
  </text>
  <text x="20" y="348" font-size="12" fill="#6a819a">
    addition to the backbone; every tensor shape is unchanged.
  </text>
</svg>
