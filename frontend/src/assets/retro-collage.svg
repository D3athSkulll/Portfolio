<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380">
  <rect width="380" height="380" fill="#100c18"/>
  <g fill="none" stroke-width="3" opacity="0.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- CRT television -->
    <g stroke="#6b4450">
      <rect x="22" y="38" width="100" height="78" rx="7"/>
      <rect x="33" y="49" width="62" height="56" rx="3"/>
      <circle cx="108" cy="62" r="4"/>
      <circle cx="108" cy="80" r="4"/>
      <circle cx="108" cy="98" r="4"/>
      <path d="M58 38 L48 18 M80 38 L94 16"/>
      <path d="M40 116 L36 128 M104 116 L108 128"/>
    </g>
    <!-- VHS cassette -->
    <g stroke="#57682f">
      <rect x="176" y="26" width="128" height="80" rx="5"/>
      <circle cx="214" cy="70" r="17"/>
      <circle cx="266" cy="70" r="17"/>
      <rect x="204" y="38" width="72" height="12"/>
    </g>
    <!-- floppy disk -->
    <g stroke="#7a682f">
      <rect x="312" y="150" width="48" height="48" rx="2"/>
      <rect x="324" y="150" width="20" height="17"/>
      <rect x="320" y="178" width="30" height="18"/>
    </g>
    <!-- arcade joystick -->
    <g stroke="#5f3f72">
      <ellipse cx="72" cy="210" rx="38" ry="15"/>
      <path d="M72 205 L72 166"/>
      <circle cx="72" cy="158" r="13"/>
      <rect x="42" y="200" width="12" height="9"/>
      <rect x="90" y="200" width="12" height="9"/>
    </g>
    <!-- game cartridge -->
    <g stroke="#3f5074">
      <path d="M150 150 h88 v22 l-11 11 h-77 z"/>
      <rect x="165" y="169" width="58" height="32"/>
      <path d="M162 150 v-10 h64 v10"/>
    </g>
    <!-- d-pad -->
    <g stroke="#6b4450">
      <path d="M258 214 h20 v20 h20 v20 h-20 v20 h-20 v-20 h-20 v-20 h20 z"/>
    </g>
    <!-- arcade cabinet -->
    <g stroke="#57682f">
      <path d="M28 262 h74 l-7 96 h-60 z"/>
      <rect x="39" y="279" width="48" height="32"/>
      <path d="M36 324 h54 l-3 16 h-48 z"/>
    </g>
    <!-- pixel heart -->
    <g stroke="#743f3f">
      <path d="M164 306 h16 v-16 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 z"/>
    </g>
    <!-- boombox -->
    <g stroke="#5f5f2f">
      <rect x="252" y="304" width="104" height="52" rx="5"/>
      <circle cx="278" cy="330" r="13"/>
      <circle cx="330" cy="330" r="13"/>
      <rect x="298" y="312" width="14" height="8"/>
      <path d="M262 300 l14 -12 M346 300 l-14 -12"/>
    </g>
  </g>
</svg>
