name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-profile.mjs
      - run: node scripts/blog.mjs check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: check generated TS bindings are current
        run: cargo test export_bindings
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/frontend/src/types
      - run: git diff --exit-code frontend/src/types/profile.gen.ts
        working-directory: ${{ github.workspace }}
      - name: generate blog artifacts
        run: cargo run --bin bloggen -- --dev
        env:
          CONTENT_ROOT: ${{ github.workspace }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: install deps
        run: |
          npm ci
          (cd frontend && npm ci)
      - name: generate blog + build SPA
        run: |
          cargo run --bin bloggen --manifest-path backend/Cargo.toml -- --dev
          (cd frontend && npm run build)
        env:
          CONTENT_ROOT: ${{ github.workspace }}
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run e2e
        env:
          CI: "1"

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - name: build the production bundle
        run: |
          (cd frontend && npm ci && npm run build)
          cargo run --bin bloggen --manifest-path backend/Cargo.toml -- --dev
          cargo build --release --manifest-path backend/Cargo.toml
        env:
          CONTENT_ROOT: ${{ github.workspace }}
      - run: npm run lighthouse   # asserts Perf & A11y >= 0.9 on / and /blog
